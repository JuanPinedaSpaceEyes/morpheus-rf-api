<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Morpheus RF — Peaks Live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue"; }
    body { margin: 0; background: #0b1220; color: #e6edf3; }
    header { padding: 16px 20px; background: #0f172a; border-bottom: 1px solid #1f2a44; display:flex; align-items:baseline; gap:16px; }
    h1 { font-size: 18px; margin: 0; }
    .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border:1px solid #2b375b; color:#abc4ff; }
    main { padding: 16px 20px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(140px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .card { background: #0f172a; border:1px solid #1f2a44; border-radius: 10px; padding: 12px; }
    .muted { color: #9fb3c8; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #1f2a44; text-align: left; }
    th { color: #9fb3c8; font-weight: 600; font-size: 12px; letter-spacing: .02em; text-transform: uppercase; }
    tr:hover td { background: rgba(173,216,230,0.06); }
    .ok { color: #7ee787; }
    .warn { color: #f1e05a; }
    .err { color: #ff7b72; }
    footer { padding: 12px 20px; color:#9fb3c8; border-top:1px solid #1f2a44; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
</head>
<body>
<header>
  <h1>🎯 Morpheus RF — Peaks Live</h1>
  <span id="conn" class="pill">conectando…</span>
</header>

<main>
  <div class="grid">
    <div class="card"><div class="muted">Estado</div><div id="statusText" class="mono">…</div></div>
    <div class="card"><div class="muted">Centro</div><div id="center" class="mono">…</div></div>
    <div class="card"><div class="muted">Sample rate</div><div id="sr" class="mono">…</div></div>
    <div class="card"><div class="muted">Bloque</div><div id="block" class="mono">—</div></div>
  </div>

  <div class="card">
    <div class="muted">Picos recientes</div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Frecuencia</th>
          <th>Potencia</th>
          <th>SNR aprox.</th>
          <th>Δ Offset</th>
        </tr>
      </thead>
      <tbody id="peaksBody">
        <tr><td colspan="5" class="muted">Esperando datos…</td></tr>
      </tbody>
    </table>
    <div class="muted" style="margin-top:8px;">
      Ruido: <span id="noise" class="mono">—</span> · Máx: <span id="pmax" class="mono">—</span> · t(capt): <span id="tcap" class="mono">—</span>s
    </div>
  </div>
</main>

<footer>
  <span class="muted">WebSocket: </span><span id="wsInfo" class="mono">—</span>
</footer>

<script>
  const fmtFreq = (hz) => {
    if (hz >= 1e9) return (hz/1e9).toFixed(6) + " GHz";
    if (hz >= 1e6) return (hz/1e6).toFixed(3) + " MHz";
    if (hz >= 1e3) return (hz/1e3).toFixed(1) + " kHz";
    return hz.toFixed(0) + " Hz";
  };
  const fmtDB = (x) => (x===null||x===undefined) ? "—" : x.toFixed(1) + " dB";
  const $ = (id) => document.getElementById(id);

  let centerHz = null;
  let srHz = null;
  let lastBlockId = -1;
  let ws = null;
  let reconnectTimer = null;

  async function loadStatus() {
    try {
      const res = await fetch("/status");
      if (!res.ok) throw new Error(await res.text());
      const s = await res.json();
      centerHz = s.center_freq_hz;
      srHz = s.sample_rate_hz;
      $("statusText").textContent = s.configured ? "capturando ✅" : (s.last_error || "inactivo");
      $("center").textContent = fmtFreq(centerHz);
      $("sr").textContent = fmtFreq(srHz);
    } catch (e) {
      $("statusText").textContent = "error al cargar /status";
      console.error(e);
    }
  }

  function setConn(state, info="") {
    const tag = $("conn");
    const wsInfo = $("wsInfo");
    wsInfo.textContent = info;
    if (state === "open") {
      tag.textContent = "conectado";
      tag.className = "pill ok";
    } else if (state === "closed") {
      tag.textContent = "desconectado";
      tag.className = "pill err";
    } else {
      tag.textContent = "conectando…";
      tag.className = "pill";
    }
  }

  function renderPeaks(payload) {
    $("block").textContent = payload.block_id;
    $("noise").textContent = fmtDB(payload.noise_floor_db);
    $("pmax").textContent  = fmtDB(payload.max_power_db);
    $("tcap").textContent  = (payload.capture_time_sec || 0).toFixed(2);

    const tbody = $("peaksBody");
    tbody.innerHTML = "";
    const nf = payload.noise_floor_db ?? 0;

    if (!payload.peaks || !payload.peaks.length) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="5" class="muted">Sin picos sobre umbral</td>`;
      tbody.appendChild(tr);
      return;
    }

    payload.peaks.forEach((pk, i) => {
      const snr = (pk.power_db - nf);
      const off = centerHz ? (pk.frequency_hz - centerHz)/1e6 : 0;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="mono">${i+1}</td>
        <td class="mono">${fmtFreq(pk.frequency_hz)}</td>
        <td class="mono">${fmtDB(pk.power_db)}</td>
        <td class="mono">${snr.toFixed(1)} dB</td>
        <td class="mono">${off >= 0 ? "+" : ""}${off.toFixed(3)} MHz</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function connectWS() {
    try {
      setConn("connecting");
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const url = `${proto}://${location.host}/ws/peaks`;
      ws = new WebSocket(url);
      ws.onopen = () => setConn("open", url);
      ws.onclose = () => {
        setConn("closed", "—");
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectWS, 1200);
      };
      ws.onerror = () => { /* silenciar; onclose reconecta */ };
      ws.onmessage = (ev) => {
        try {
          const payload = JSON.parse(ev.data);
          if (!payload.block_id || payload.block_id === lastBlockId) return;
          lastBlockId = payload.block_id;
          renderPeaks(payload);
        } catch (e) {
          console.error("msg parse error", e);
        }
      };
    } catch (e) {
      console.error(e);
      setConn("closed", "err");
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connectWS, 1500);
    }
  }

  // init
  loadStatus();
  connectWS();
  // refresca status cada 5s
  setInterval(loadStatus, 5000);
</script>
</body>
</html>
